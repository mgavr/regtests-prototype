spring.application.name=demo-service
server.port=8081

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/quotes
spring.datasource.username=quotes
spring.datasource.password=
partner.url=${PARTNER_URL:http://localhost:8082}

mybatis.mapper-locations=classpath:mappers/*.xml

# Flips the one deliberate regression in QuoteService. See REG-25.
demo.break=${DEMO_BREAK:false}
# Makes one partner call through a client nothing can hook, to show how that fails.
demo.unhooked-client=${DEMO_UNHOOKED_CLIENT:false}
